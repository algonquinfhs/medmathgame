<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medication draw-up</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: white; color: #25352f; font: 16px/1.45 "Segoe UI", Arial, sans-serif; }
main { max-width: 1200px; margin: clamp(24px, 8vh, 80px) auto; padding: 0 clamp(16px, 4vw, 52px); display: grid; grid-template-columns: minmax(190px, 1fr) minmax(0, 3.5fr); gap: 30px; align-items: start; }
h1, p { margin: 0; }
h1 { font-size: 16px; font-weight: 600; }
.order { margin: 8px 0; font-size: 23px; font-weight: 600; line-height: 1.3; }
.dose { white-space: nowrap; }
.stock { font-size: 15px; color: #52625b; }
#instruction { margin-bottom: 12px; }
.scene { display: block; width: 100%; background: #f3f5f3; border-radius: 6px; user-select: none; touch-action: none; }
.scene [role=button] { cursor: pointer; }
.tray { background: #f3f5f3; border-radius: 6px; }
/* Keep the physical scale fixed from insertion through the full plunger stroke.
   Narrow screens can scroll along the equipment using the space beside it. */
.scene.vertical { --unit: clamp(1.8px, 0.2vw, 2px); width: min(100%, calc(120 * var(--unit))); height: calc(861 * var(--unit)); margin-inline: auto; }
@media (min-width: 641px) { aside { position: sticky; top: 20px; } }
.scene [role=slider] { cursor: ns-resize; }
#padTarget { cursor: grab; }
.scene [tabindex]:focus { outline: none; }
.scene [tabindex]:focus-visible > rect:last-child { stroke: #43765e; stroke-width: 2; stroke-dasharray: 5 3; }
.hot { fill: #d5ead440; stroke: #43765e; stroke-width: 2; stroke-dasharray: 4 4; }
.controls, .measure, #answer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.controls, #answer { margin-top: 14px; }
.measure { font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
#check { color: white; background: #245942; border: 0; padding: 9px 16px; border-radius: 5px; font-weight: 600; }
#check:hover { background: #194b35; }
#reset { margin-left: auto; }
#reset { color: #4c5e54; border: 0; background: transparent; text-decoration: underline; }
#nudge { display: none; }
#nudge button { min-width: 31px; min-height: 32px; border: 1px solid #c5ccc7; border-radius: 4px; background: white; }
.good { color: #226244; } .bad { color: #a63226; }
[hidden] { display: none !important; }
@media (pointer: coarse), (max-width: 640px) { #nudge { display: inline-flex; gap: 4px; } }
@media (max-width: 640px) { main { grid-template-columns: 1fr; gap: 20px; margin: 20px auto; } .order { font-size: 21px; } .controls, .measure { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style></head><body>
<main>
<aside aria-labelledby="order-heading">

  <div id="answer" hidden>

    <strong id="result" role="status" hidden></strong>
  </div>
</aside>

  </div>
  <button id="reset" hidden>Restart</button>
</div>
</section></main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const scene = byId("scene");
const intervals = 50;
const scaleLength = 560 * .42;
const targetTick = Math.round((0.8 / 2) * intervals);
const releaseDelay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 480;
let step = 0, volume = 0, selected = false, busy = false, gesture = null, timer = null;
const show = (element, visible) => element.toggleAttribute("hidden", !visible);
const clamp = (x, min, max) => Math.min(max, Math.max(min, x));
function point(event) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(scene.getScreenCTM().inverse());
}
function message(text) {
  byId("instruction").textContent = text;
}
function clearResult() {
  show(byId("result"), false);
  byId("result").replaceChildren();
}
function setVolume(next) {
  volume = clamp(next, 0, 1);
  const shift = volume * scaleLength;
  byId("fluid").setAttribute("width", shift);
  byId("pistonArtPosition").setAttribute("transform", "translate(" + shift + " 0)");
  byId("slider").setAttribute("transform", "translate(" + shift + " 0)");
  const reading = volume.toFixed(2);
  byId("slider").setAttribute("aria-valuenow", reading);
  byId("slider").setAttribute("aria-valuetext", reading + " milliliters");
  clearResult();
}
function moveInstrument(offset) {
  byId("instrument").setAttribute("transform", "translate(" + offset + " 0)");
}
function renderStep() {
  scene.classList.toggle("vertical", step > 0);
  scene.setAttribute("viewBox", step === 0 ? "125 0 570 315" : "150 -36 120 861");
  show(byId("prep"), step === 0);
  show(byId("draw"), step > 0);
  for (const id of ["needleGrab", "insertTarget"]) show(byId(id), step === 1);
  for (const id of ["slider", "measure", "answer"]) show(byId(id), step === 2);
  show(byId("stopHalo"), step === 0 && selected);
  show(byId("reset"), step > 0);
  byId("check").disabled = step !== 2;
  moveInstrument(step === 1 ? 128 : 0);
  if (step === 0) message(selected ? "Touch the stopper to swab it." : "Drag the swab to the vial stopper.");
  if (step === 1) message(selected ? "Touch the stopper to insert the needle." : "Slide the needle up into the vial stopper.");
  if (step === 2) message("Drag the plunger down. Read the top edge of the black stopper against the printed marks.");
}
function pick() {
  if (busy || step === 2) return;
  selected = true;
  renderStep();
  (step === 0 ? byId("vialTarget") : byId("insertTarget")).focus({preventScroll:true});
}
function useTool() {
  if (busy || step > 1) return;
  if (!selected) {
    message(step === 0 ? "Select the alcohol swab first" : "Select the syringe first");
    return;
  }
  busy = true;
  if (step === 0) {
    byId("padTarget").setAttribute("transform", "translate(147 -73)");
    if (releaseDelay) byId("padTarget").animate([{transform:"translate(139px,-73px)"},{transform:"translate(155px,-73px)"},{transform:"translate(139px,-73px)"}], {duration:220,iterations:2});
    show(byId("stopHalo"), false);
    message("Swabbing the stopper…");
  } else {
    if (releaseDelay) byId("instrument").style.transition = "transform .25s ease-out";
    moveInstrument(0);
    message("Inserting the needle…");
  }
  timer = setTimeout(() => {
    step++; selected = false; busy = false; timer = null;
    byId("instrument").style.transition = "";
    renderStep(); (step === 1 ? byId("needleGrab") : byId("slider")).focus({preventScroll:true});
  }, releaseDelay);
}
function start(event, type) {
  if (busy || gesture || !event.isPrimary || event.button !== 0) return;
  event.preventDefault();
  const p = point(event);
  gesture = {type, x:p.x, y:p.y, initial:volume, moved:false, touchedVial:false, pointerId:event.pointerId};
  if (type === "swab") show(byId("stopHalo"), true);
  if (type === "volume") byId("slider").focus({preventScroll:true});
  scene.setPointerCapture(event.pointerId);
}
function swabTouchesVial(p, dx, dy) {
  const vial = byId("vialTarget").getBBox();
  const cloth = byId("cloth").getBBox();
  const left = vial.x - 5, right = vial.x + vial.width + 5;
  const top = vial.y - 5, bottom = vial.y + vial.height + 5;
  const pointerOnVial = p.x >= left && p.x <= right && p.y >= top && p.y <= bottom;
  const x = cloth.x + dx, y = cloth.y + dy;
  return pointerOnVial || (x <= right && x + cloth.width >= left && y <= bottom && y + cloth.height >= top);
}
scene.addEventListener("pointermove", event => {
  if (!gesture || event.pointerId !== gesture.pointerId) return;
  const p = point(event), dx = p.x - gesture.x, dy = p.y - gesture.y;
  if (Math.hypot(dx, dy) >= 3) gesture.moved = true;
  if (!gesture.moved) return;
  if (gesture.type === "volume") setVolume(gesture.initial + dy / scaleLength);
  if (gesture.type === "swab") {
    byId("padTarget").setAttribute("transform", "translate(" + dx + " " + dy + ")");
    gesture.touchedVial ||= swabTouchesVial(p, dx, dy);
  }
  if (gesture.type === "syringe") moveInstrument(clamp(128 + dy, 0, 164));
});
function finish(event, cancelled) {
  if (!gesture || event.pointerId !== gesture.pointerId) return;
  const g = gesture, p = point(event), dx = p.x-g.x, dy=p.y-g.y;
  gesture = null;
  if (scene.hasPointerCapture(event.pointerId)) scene.releasePointerCapture(event.pointerId);
  if (g.type === "volume") {
    const finalVolume = cancelled ? g.initial : clamp(g.initial + dy / scaleLength, 0, 1);
    setVolume(Math.round(finalVolume * intervals) / intervals);
    return;
  }
  byId("padTarget").removeAttribute("transform");
  if (cancelled) { renderStep(); return; }
  const dragged = g.moved || Math.hypot(dx, dy) >= 3;
  const applied = g.type === "swab" ? g.touchedVial || swabTouchesVial(p, dx, dy) : 206 + dy <= 118;
  if (dragged && applied) {
    selected = true; useTool();
  } else if (dragged) {
    selected = false; renderStep();
  } else { pick(); }
}
scene.addEventListener("pointerup", event => finish(event, false));
scene.addEventListener("pointercancel", event => finish(event, true));
scene.addEventListener("lostpointercapture", event => {
  if (gesture && gesture.pointerId === event.pointerId) {
    if (gesture.type === "volume") setVolume(gesture.initial);
    gesture = null; byId("padTarget").removeAttribute("transform"); renderStep();
  }
});
for (const [id, type] of [["padTarget","swab"],["needleGrab","syringe"],["slider","volume"]]) {
  byId(id).addEventListener("pointerdown", event => start(event, type));
}
for (const id of ["vialTarget","insertTarget"]) byId(id).addEventListener("click", useTool);
for (const id of ["padTarget","needleGrab"]) byId(id).addEventListener("click", e => { if (e.detail === 0) pick(); });
for (const id of ["padTarget","needleGrab","vialTarget","insertTarget"]) byId(id).addEventListener("keydown", event => {
  if (event.key !== "Enter" && event.key !== " ") return;
  event.preventDefault();
  if (id === "padTarget" || id === "needleGrab") pick(); else useTool();
});
function nudge(delta) { setVolume((Math.round(volume * intervals) + delta) / intervals); }
byId("slider").addEventListener("keydown", event => {
  const delta = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1, PageUp:5, PageDown:-5};
  if (event.key in delta) nudge(delta[event.key]);
  else if (event.key === "Home" || event.key === "End") setVolume(event.key === "Home" ? 0 : 1);
  else return;
  event.preventDefault();
});
byId("less").addEventListener("click", () => nudge(-1));
byId("more").addEventListener("click", () => nudge(1));
byId("check").addEventListener("click", () => {
  if (step !== 2 || gesture) return;
  const tick = Math.round(volume * intervals), correct = tick === targetTick;
  const feedback = byId("result");
  feedback.textContent = correct ? "Correct" : "Incorrect";
  feedback.className = correct ? "good" : "bad";
  show(feedback, true);
});
byId("reset").addEventListener("click", () => {
  clearTimeout(timer); timer = null; busy = false;
  if (gesture && scene.hasPointerCapture(gesture.pointerId)) scene.releasePointerCapture(gesture.pointerId);
  gesture = null; selected = false; step = 0;
  byId("padTarget").getAnimations().forEach(a => a.cancel());
  byId("instrument").style.transition = ""; byId("padTarget").removeAttribute("transform");
  setVolume(0); renderStep();
});
renderStep();
</script></body></html>
